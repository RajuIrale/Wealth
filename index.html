<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Irale Family Investments</title>
<style>
:root{--saf:#FF9933;--grn:#138808;--red:#E63946;--yel:#FFC107;--navy:#0b1437}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#fff;min-height:100vh;background:radial-gradient(circle at 10% 0,#ff993340,transparent 40%),radial-gradient(circle at 90% 100%,#13880840,transparent 40%),linear-gradient(160deg,#0b1437,#1b0f3a)}
.hide{display:none!important}.wrap{max-width:1000px;margin:auto;padding:16px}
.card{background:#ffffff14;border:1px solid #ffffff22;border-radius:20px;padding:18px;backdrop-filter:blur(8px)}
.login{max-width:360px;margin:12vh auto;text-align:center}.login h1{margin:0 0 6px;background:linear-gradient(90deg,var(--saf),#fff,var(--grn));-webkit-background-clip:text;color:transparent}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #ffffff44;background:#0006;color:#fff;font-size:16px}
option{color:#000}
button{cursor:pointer;border:0;border-radius:12px;padding:11px 18px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--saf),var(--red));font-size:15px}
button.g{background:linear-gradient(90deg,var(--grn),#2ecc71)}button.s{background:#ffffff22;padding:7px 12px;font-size:13px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h2{margin:0;font-size:clamp(20px,5vw,30px);background:linear-gradient(90deg,var(--saf),var(--yel),#5fe36a);-webkit-background-clip:text;color:transparent}
.stats{display:grid;gap:12px;margin:16px 0}.stat{border-radius:20px;padding:18px}
.stat small{opacity:.85;letter-spacing:1px}.stat b{display:block;font-size:clamp(26px,7vw,38px);margin-top:4px}
.s1{background:linear-gradient(135deg,#138808,#2ecc71)}.s2{background:linear-gradient(135deg,#E63946,#ff7b54)}.s3{background:linear-gradient(135deg,#FF9933,#FFC107);color:#2b1500}
.grid{display:grid;gap:16px;grid-template-columns:1fr}@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}
.pie{width:min(280px,80vw);aspect-ratio:1;border-radius:50%;margin:10px auto;display:grid;place-items:center;box-shadow:0 0 40px #ff993355}
.hole{width:58%;aspect-ratio:1;border-radius:50%;background:#12122e;display:grid;place-items:center;text-align:center;font-size:13px}
.leg div{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff18}.dot{width:14px;height:14px;border-radius:50%}.leg span{margin-left:auto;text-align:right}
.item{display:flex;align-items:center;gap:10px;padding:12px;margin:8px 0;border-radius:14px;background:#ffffff10;border-left:6px solid;flex-wrap:wrap}
.item .m{flex:1;min-width:140px}.tag{font-size:12px;background:#ffffff22;border-radius:20px;padding:2px 9px;margin-left:4px}
.auto{font-size:12px;color:var(--yel)}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:14px;z-index:9}
.modal .card{background:#1a1440;width:min(420px,100%);max-height:94vh;overflow:auto}
label{font-size:13px;opacity:.85}.row{display:flex;gap:8px}.err{color:#ff8a8a;min-height:20px}
</style></head><body>
<div id="login" class="wrap"><div class="card login"><div style="font-size:48px">🪙</div><h1>Irale Investments</h1>
<input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password">
<div class="err" id="err"></div><button class="g" style="width:100%" onclick="doLogin()">Login</button></div></div>

<div id="app" class="wrap hide">
<header><h2>🙏 Welcome, Swati Raju Irale</h2><div><span class="tag" id="st">…</span> <button class="s" onclick="exp()">⬇ Backup</button> <button class="s" onclick="document.getElementById('imp').click()">⬆ Restore</button> <button class="s" onclick="logout()">Logout</button><input type="file" id="imp" class="hide" accept=".json" onchange="imp(event)"></div></header>
<div class="stats"><div class="stat s1"><small>TOTAL INVESTMENT</small><b id="ti"></b></div><div class="stat s2"><small>TOTAL DEBT</small><b id="td"></b></div><div class="stat s3"><small>NET WORTH</small><b id="nw"></b></div></div>
<div class="grid"><div class="card"><h3 style="margin-top:0">📊 Where your money is</h3><div class="pie" id="pie"><div class="hole" id="hole"></div></div><div class="leg" id="leg"></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">💼 Investments</h3><button onclick="openM()">＋ Add</button></div><div id="list"></div></div></div>
</div>

<div id="modal" class="modal hide"><div class="card"><h3 id="mt" style="margin-top:0">Add</h3>
<label>Category</label><select id="cat"></select>
<label>Name (optional, e.g. HDFC SIP)</label><input id="nm">
<label>Amount ₹</label><input id="am" type="number" inputmode="decimal">
<label><input type="checkbox" id="ar" style="width:auto" onchange="tg()"> Auto-add every month (SIP)</label>
<div id="ab" class="hide"><label>Amount to add monthly ₹</label><input id="aa" type="number" inputmode="decimal"><label>On date of month (1-31)</label><input id="ad" type="number" min="1" max="31"></div>
<div class="row" style="margin-top:10px"><button class="g" style="flex:1" onclick="save()">Save</button><button class="s" onclick="closeM()">Cancel</button></div></div></div>

<script>
const H=(s,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const OK="2955360596587929",KEY="irale_inv_v1";
const CATS={"EPF":"#FF9933","Mutual Fund":"#138808","Stocks":"#E63946","BlackRock":"#7B2FF7","Savings":"#00B4D8","Gold":"#FFC107","Debt":"#8d99ae"};
let D=JSON.parse(localStorage.getItem(KEY)||"[]"),eid=null;
const $=i=>document.getElementById(i),R=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=s=>{const a=s.split("-");return new Date(+a[0],a[1]-1,+a[2])};
const DB_DEFAULT="https://rajuswati-86b45-default-rtdb.firebaseio.com/";/* paste your Firebase Realtime Database URL here, e.g. https://xxxx-default-rtdb.firebaseio.com */
const getDB=()=>(DB_DEFAULT||localStorage.getItem("irale_db")||"").replace(/\/$/,"");
let TS=+localStorage.getItem("irale_ts")||0;
const setSt=t=>$("st").textContent=t;
const persist=()=>{TS=Date.now();localStorage.setItem(KEY,JSON.stringify(D));localStorage.setItem("irale_ts",TS);push()};
async function push(){const b=getDB();if(!b)return setSt("💾 Local only");try{const r=await fetch(b+"/irale_family.json",{method:"PUT",body:JSON.stringify({ts:TS,items:D})});if(!r.ok)throw 0;setSt("☁ Synced")}catch{setSt("⚠ Not synced")}}
async function pull(){const b=getDB();if(!b)return setSt("💾 Local only");try{const r=await fetch(b+"/irale_family.json");if(!r.ok)throw 0;const j=await r.json();
 if(!j){if(D.length){TS=TS||Date.now();push()}}
 else if(j.ts>TS){D=j.items||[];TS=j.ts;localStorage.setItem(KEY,JSON.stringify(D));localStorage.setItem("irale_ts",TS);if($("modal").classList.contains("hide"))render()}
 setSt("☁ Synced")}catch{setSt("⚠ Offline")}}
function autoApply(){const t=new Date();t.setHours(0,0,0,0);let ch=0;
 D.forEach(it=>{if(!it.auto)return;let last=pd(it.last),y=last.getFullYear(),m=last.getMonth();
  for(let i=0;i<1200;i++){const dim=new Date(y,m+1,0).getDate(),c=new Date(y,m,Math.min(it.auto.day,dim));
   if(c>t)break;if(c>last){it.amount+=it.auto.amt;last=c;it.last=iso(c);ch=1}m++;if(m>11){m=0;y++}}});
 if(ch)persist()}
function doLogin(){if(H($("u").value.trim()+":"+$("p").value)==OK){localStorage.setItem("irale_ok","1");start()}else $("err").textContent="Wrong username or password"}
$("p").addEventListener("keydown",e=>{if(e.key=="Enter")doLogin()});
function logout(){localStorage.removeItem("irale_ok");location.reload()}
async function start(){if(!getDB()){const u=prompt("One-time setup: paste your Firebase Realtime Database URL (leave empty for this-device-only)");if(u&&u.trim())localStorage.setItem("irale_db",u.trim())}
 $("login").classList.add("hide");$("app").classList.remove("hide");render();await pull();autoApply();render();setInterval(pull,20000);addEventListener("focus",pull)}
function render(){const inv=D.filter(x=>x.cat!="Debt"),ti=inv.reduce((s,x)=>s+x.amount,0),td=D.filter(x=>x.cat=="Debt").reduce((s,x)=>s+x.amount,0);
 $("ti").textContent=R(ti);$("td").textContent=R(td);$("nw").textContent=R(ti-td);
 const tot={};inv.forEach(x=>tot[x.cat]=(tot[x.cat]||0)+x.amount);
 let a=0,g=[],lg="";Object.keys(CATS).filter(c=>tot[c]).forEach(c=>{const p=tot[c]/ti*100;g.push(`${CATS[c]} ${a}% ${a+p}%`);a+=p;
  lg+=`<div><i class="dot" style="background:${CATS[c]}"></i>${c}<span>${R(tot[c])}<br><small>${p.toFixed(1)}%</small></span></div>`});
 $("pie").style.background=g.length?`conic-gradient(${g.join(",")})`:"#ffffff22";
 $("hole").innerHTML=`<div>Total<br><b style="font-size:18px">${R(ti)}</b></div>`;$("leg").innerHTML=lg||"<p>No investments yet. Tap ＋ Add 👉</p>";
 $("list").innerHTML=D.map(x=>`<div class="item" style="border-color:${CATS[x.cat]}"><div class="m"><b>${esc(x.name||x.cat)}</b><span class="tag">${x.cat}</span><br><span style="font-size:18px">${R(x.amount)}</span>${x.auto?`<div class="auto">🔁 +${R(x.auto.amt)} on ${x.auto.day}th every month</div>`:""}</div><button class="s" onclick="openM('${x.id}')">✏️ Edit</button><button class="s" onclick="del('${x.id}')">🗑</button></div>`).join("")}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function openM(id){eid=id||null;const x=D.find(i=>i.id==id)||{};$("cat").innerHTML=Object.keys(CATS).map(c=>`<option ${x.cat==c?"selected":""}>${c}</option>`).join("");
 $("mt").textContent=id?"Edit":"Add";$("nm").value=x.name||"";$("am").value=x.amount??"";$("ar").checked=!!x.auto;$("aa").value=x.auto?.amt||"";$("ad").value=x.auto?.day||"";tg();$("modal").classList.remove("hide")}
function closeM(){$("modal").classList.add("hide")}
function tg(){$("ab").classList.toggle("hide",!$("ar").checked)}
function save(){const amt=parseFloat($("am").value);if(isNaN(amt)||amt<0)return alert("Enter a valid amount");
 let auto=null;if($("ar").checked){const a=parseFloat($("aa").value),d=parseInt($("ad").value);if(!(a>0)||!(d>=1&&d<=31))return alert("Enter monthly amount and a date 1-31");auto={amt:a,day:d}}
 const x=D.find(i=>i.id==eid);
 if(x){x.cat=$("cat").value;x.name=$("nm").value.trim();x.amount=amt;if(auto&&(!x.auto||x.auto.day!=auto.day))x.last=iso(new Date());x.auto=auto}
 else D.push({id:Date.now()+"",cat:$("cat").value,name:$("nm").value.trim(),amount:amt,auto,last:iso(new Date())});
 persist();closeM();render()}
function del(id){if(confirm("Delete this entry?")){D=D.filter(x=>x.id!=id);persist();render()}}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));a.download="irale-investments-"+iso(new Date())+".json";a.click()}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;D=d;persist();autoApply();render()}catch{alert("Invalid backup file")}};r.readAsText(f)}
if(localStorage.getItem("irale_ok"))start();
</script></body></html>
